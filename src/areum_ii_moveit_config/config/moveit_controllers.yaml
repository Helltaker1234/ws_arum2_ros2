# MoveIt uses this configuration for controller management

# goal 마진을 크게 주어 MTC 에서 다음 stage 로 무리없이 넘어가게 함.
trajectory_execution:
  allowed_execution_duration_scaling: 1.5
  allowed_goal_duration_margin: 3.0
  execution_duration_monitoring: false # 예외처리 없애기 (오른팔 다음 왼팔 Home 자세로 넘어갈때 제어성공여부 무시)


moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - areumii_arm_l_controller
    - areumii_arm_r_controller
    - areumii_gripper_l_controller
    - areumii_gripper_r_controller

  areumii_arm_l_controller:
    type: FollowJointTrajectory
    joints:
      - shoulder_pitch_joint_L
      - shoulder_roll_joint_L
      - shouler_yaw_joint_L
      - elbow_joint_L
      - wrist_roll_joint_L
      - wrist_yaw_joint_L
      - wrist_pitch_joint_L
    action_ns: follow_joint_trajectory
    default: true
  areumii_arm_r_controller:
    type: FollowJointTrajectory
    joints:
      - shoulder_pitch_joint_R
      - shoulder_roll_joint_R
      - shoulder_yaw_joint_R
      - elbow_joint_R
      - wrist_roll_joint_R
      - wrist_yaw_joint_R
      - wrist_pitch_joint_R
    action_ns: follow_joint_trajectory
    default: true
  areumii_gripper_l_controller:
    type: GripperCommand
    joints:
      - gripper_left_finger_joint_L
    action_ns: gripper_cmd
    default: true
    allow_failure: true
  areumii_gripper_r_controller:
    type: GripperCommand
    joints:
      - gripper_left_finger_joint_R
    action_ns: gripper_cmd
    default: true
    allow_failure: true
areumii_controller:
  # Publish all joint states -----------------------------------
  joint_state_controller:
    type: joint_state_controller/JointStateController
    publish_rate: 50

  # Position Controllers --------------------------------------
  shoulder_roll_joint_L_position_controller:
    type: effort_controllers/JointPositionController
    joint: shoulder_roll_joint_L
    pid: {p: 100.0, i: 0.01, d: 10.0}
  shouler_yaw_joint_L_position_controller:
    type: effort_controllers/JointPositionController
    joint: shouler_yaw_joint_L
    pid: {p: 100.0, i: 0.01, d: 10.0}
  elbow_joint_L_position_controller:

    type: effort_controllers/JointPositionController
    joint: wrist_yaw_joint_L
    pid: {p: 100.0, i: 0.01, d: 10.0}
  wrist_pitch_joint_L_position_controller:
    type: effort_controllers/JointPositionController
    joint: wrist_pitch_joint_L
    pid: {p: 100.0, i: 0.01, d: 10.0}
  shoulder_yaw_joint_R_position_controller:

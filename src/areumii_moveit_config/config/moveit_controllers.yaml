# MoveIt uses this configuration for controller management

trajectory_execution:
  allowed_execution_duration_scaling: 1.5
  allowed_goal_duration_margin: 1.0

  execution_duration_monitoring: True
  # True : moveit 이 목표 trajectory 도달여부를 확인하겠다.
  # False : 확인하지 않겠다. (근데 이러면 Rviz 상에서는 무한대기에 빠질 수 있음)

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - areumii_arm_l_controller
    - areumii_arm_r_controller

  areumii_arm_l_controller:
    type: FollowJointTrajectory
    joints:
      - shoulder_pitch_joint_L
      - shoulder_roll_joint_L
      - shoulder_yaw_joint_L
      - elbow_joint_L
      - wrist_roll_joint_L
      - wrist_yaw_joint_L
      - wrist_pitch_joint_L
    action_ns: follow_joint_trajectory
    default: true
  areumii_arm_r_controller:
    type: FollowJointTrajectory
    joints:
      - shoulder_pitch_joint_R
      - shoulder_roll_joint_R
      - shoulder_yaw_joint_R
      - elbow_joint_R
      - wrist_roll_joint_R
      - wrist_yaw_joint_R
      - wrist_pitch_joint_R
    action_ns: follow_joint_trajectory
    default: true